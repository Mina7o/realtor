apiVersion: 1

deleteDatasources:
  - name: Loki

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    uid: loki_ds
    jsonData:
      derivedFields:
        - name: batch_id
          matcherRegex: batch_id=(\w+)
          url: '$${__value.raw}'
          datasourceUid: tempo_ds

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo_ds

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prom_ds
