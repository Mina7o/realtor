name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --break-system-packages ruff
      - run: ruff check app/ tests/ --ignore=E402,F401,E501

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --break-system-packages -r requirements/web.txt
      - run: pip install --break-system-packages -r requirements/worker.txt
      - run: pip install --break-system-packages pytest pytest-flask
      - run: cp .env.example .env
      - run: python -m pytest tests/ -v --tb=short
