<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([35.7796, -78.6382], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const userLoc = [pos.coords.latitude, pos.coords.longitude];
                    map.setView(userLoc, 12);
                    L.marker(userLoc).addTo(map)
                        .bindPopup('Your Location')
                        .openPopup();
                },
                () => {}
            );
        }

        fetch('/api/listings?limit=500')
            .then(r => r.json())
            .then(data => {
                const properties = data.listings || [];
                properties.forEach(p => {
                    if (!p.lat || !p.lng) return;
                    const marker = L.marker([p.lat, p.lng]).addTo(map);
                    const price = p.list_price ? '$' + Number(p.list_price).toLocaleString() : 'N/A';
                    const deal = p.deal_tier ? `<br><strong>${p.deal_tier}</strong>` : '';
                    marker.bindPopup(`
                        <b>${p.address || ''}</b><br>
                        ${p.city || ''}, ${p.state || ''}<br>
                        ${price}${deal}
                        ${p.url ? `<br><a href="${p.url}" target="_blank">View</a>` : ''}
                    `);
                });
            });
    </script>
</body>
</html>
